<!--
  Three-state walkthrough of a schema change. Toggle between:
    1. Initial schema (before)
    2. Edited schema (after)
    3. Generated migration.sql (the diff Prisma writes)
  Lets the student see the "schema → migration" round trip without
  installing anything.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Schema → migration — the round trip</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 960px; margin: 2.5rem auto; padding: 0 1rem; line-height: 1.55; color: #18181b; }
      h1 { font-size: 1.3rem; }
      .scenarios { display: flex; gap: 0.4rem; margin: 1rem 0 0.7rem; flex-wrap: wrap; }
      .scenarios button {
        padding: 0.45rem 0.85rem; border-radius: 6px; border: 1px solid #d4d4d8;
        background: #fff; cursor: pointer; font-size: 0.83rem;
      }
      .scenarios button.active { background: #15803d; color: #fff; border-color: #15803d; }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .col { border: 1px solid #e4e4e7; border-radius: 8px; padding: 0.9rem; background: #fafafa; }
      .col h2 {
        margin: 0 0 0.6rem; font-size: 0.78rem; text-transform: uppercase;
        letter-spacing: 0.08em; color: #71717a;
      }
      pre {
        background: #0a0a0d; color: #ededee; padding: 0.85rem 1rem; border-radius: 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.8rem;
        line-height: 1.55; margin: 0; overflow-x: auto; min-height: 18rem;
      }
      .keyword { color: #38bdf8; }
      .string  { color: #7fff5b; }
      .type    { color: #c084fc; }
      .number  { color: #fbbf24; }
      .comment { color: #71717a; font-style: italic; }
      .add { background: rgba(127, 255, 91, 0.12); display: inline-block; width: 100%; }
      .note {
        margin-top: 0.8rem; font-size: 0.84rem; padding: 0.7rem 0.9rem;
        background: #ecfdf5; border-left: 3px solid #16a34a; color: #166534;
        border-radius: 4px;
      }
      .cmd {
        font-family: ui-monospace, monospace; background: #f4f4f5; padding: 1px 6px;
        border-radius: 3px; font-size: 0.84rem;
      }
    </style>
  </head>
  <body>
    <h1>Edit the schema → Prisma writes the SQL</h1>
    <p>Three scenarios. Each one shows the schema before and after, and the migration.sql Prisma would generate after you run <span class="cmd">npx prisma migrate dev</span>.</p>

    <div class="scenarios" id="scenarios">
      <button data-id="add-col" class="active">Add a column (bio)</button>
      <button data-id="add-idx">Add an index</button>
      <button data-id="add-model">Add a new model (Comment)</button>
    </div>

    <div class="grid">
      <div class="col">
        <h2>prisma/schema.prisma — after your edit</h2>
        <pre id="schema"></pre>
      </div>
      <div class="col">
        <h2>migrations/<span id="ts"></span>/migration.sql — generated</h2>
        <pre id="sql"></pre>
      </div>
    </div>

    <div class="note" id="note"></div>

    <script>
      const scenarios = {
        "add-col": {
          ts: "20260616143111_add_user_bio",
          schema:
`<span class="keyword">model</span> <span class="type">User</span> {
  id        <span class="type">Int</span>      @id @default(autoincrement())
  email     <span class="type">String</span>   @unique
  name      <span class="type">String</span>
<span class="add">  bio       <span class="type">String</span>?                       <span class="comment">// ← added</span></span>
  createdAt <span class="type">DateTime</span> @default(now())

  posts     <span class="type">Post</span>[]
}`,
          sql:
`<span class="comment">-- AlterTable</span>
<span class="keyword">ALTER TABLE</span> <span class="string">"User"</span> <span class="keyword">ADD COLUMN</span> <span class="string">"bio"</span> <span class="keyword">TEXT</span>;`,
          note: "Adding a NULLABLE column is the safest schema change. Prisma emits a single ALTER TABLE ADD COLUMN. Existing rows get NULL for the new field. Your TypeScript types update on the next save.",
        },
        "add-idx": {
          ts: "20260616143415_index_post_author",
          schema:
`<span class="keyword">model</span> <span class="type">Post</span> {
  id          <span class="type">Int</span>       @id @default(autoincrement())
  title       <span class="type">String</span>
  body        <span class="type">String</span>?
  publishedAt <span class="type">DateTime</span>?
  createdAt   <span class="type">DateTime</span>  @default(now())

  authorId    <span class="type">Int</span>
  author      <span class="type">User</span>      @relation(fields: [authorId], references: [id], onDelete: <span class="type">Cascade</span>)

<span class="add">  @@index([authorId])                       <span class="comment">// ← added</span></span>
}`,
          sql:
`<span class="comment">-- CreateIndex</span>
<span class="keyword">CREATE INDEX</span> <span class="string">"Post_authorId_idx"</span> <span class="keyword">ON</span> <span class="string">"Post"</span>(<span class="string">"authorId"</span>);`,
          note: "Indexes are pure performance — they don't change query results, only how fast they run. Prisma doesn't auto-create indexes for foreign keys; you opt in with @@index. Add one whenever you frequently filter / sort by a column.",
        },
        "add-model": {
          ts: "20260616143822_add_comments",
          schema:
`<span class="keyword">model</span> <span class="type">User</span> {
  <span class="comment">// ... existing fields</span>
<span class="add">  comments  <span class="type">Comment</span>[]                      <span class="comment">// ← added</span></span>
}

<span class="keyword">model</span> <span class="type">Post</span> {
  <span class="comment">// ... existing fields</span>
<span class="add">  comments  <span class="type">Comment</span>[]                      <span class="comment">// ← added</span></span>
}

<span class="add"><span class="keyword">model</span> <span class="type">Comment</span> {
  id        <span class="type">Int</span>      @id @default(autoincrement())
  body      <span class="type">String</span>
  createdAt <span class="type">DateTime</span> @default(now())

  postId    <span class="type">Int</span>
  post      <span class="type">Post</span>     @relation(fields: [postId], references: [id], onDelete: <span class="type">Cascade</span>)

  userId    <span class="type">Int</span>
  user      <span class="type">User</span>     @relation(fields: [userId], references: [id], onDelete: <span class="type">Cascade</span>)
}</span>`,
          sql:
`<span class="comment">-- CreateTable</span>
<span class="keyword">CREATE TABLE</span> <span class="string">"Comment"</span> (
  <span class="string">"id"</span>        <span class="keyword">SERIAL</span> <span class="keyword">NOT NULL</span>,
  <span class="string">"body"</span>      <span class="keyword">TEXT</span> <span class="keyword">NOT NULL</span>,
  <span class="string">"createdAt"</span> <span class="keyword">TIMESTAMP</span>(<span class="number">3</span>) <span class="keyword">NOT NULL DEFAULT CURRENT_TIMESTAMP</span>,
  <span class="string">"postId"</span>    <span class="keyword">INTEGER</span> <span class="keyword">NOT NULL</span>,
  <span class="string">"userId"</span>    <span class="keyword">INTEGER</span> <span class="keyword">NOT NULL</span>,
  <span class="keyword">CONSTRAINT</span> <span class="string">"Comment_pkey"</span> <span class="keyword">PRIMARY KEY</span> (<span class="string">"id"</span>)
);

<span class="comment">-- AddForeignKey</span>
<span class="keyword">ALTER TABLE</span> <span class="string">"Comment"</span> <span class="keyword">ADD CONSTRAINT</span> <span class="string">"Comment_postId_fkey"</span>
  <span class="keyword">FOREIGN KEY</span> (<span class="string">"postId"</span>) <span class="keyword">REFERENCES</span> <span class="string">"Post"</span>(<span class="string">"id"</span>)
  <span class="keyword">ON DELETE CASCADE ON UPDATE CASCADE</span>;

<span class="comment">-- AddForeignKey</span>
<span class="keyword">ALTER TABLE</span> <span class="string">"Comment"</span> <span class="keyword">ADD CONSTRAINT</span> <span class="string">"Comment_userId_fkey"</span>
  <span class="keyword">FOREIGN KEY</span> (<span class="string">"userId"</span>) <span class="keyword">REFERENCES</span> <span class="string">"User"</span>(<span class="string">"id"</span>)
  <span class="keyword">ON DELETE CASCADE ON UPDATE CASCADE</span>;`,
          note: "A new model with two foreign keys generates: CreateTable + two AddForeignKey statements. The virtual fields (User.comments, Post.comments) don't show up in the SQL — they're TypeScript-side conveniences for the typed API, not real columns.",
        },
      };

      function show(id) {
        const s = scenarios[id];
        document.querySelectorAll(".scenarios button").forEach(b => b.classList.toggle("active", b.dataset.id === id));
        document.getElementById("ts").textContent = s.ts;
        document.getElementById("schema").innerHTML = s.schema;
        document.getElementById("sql").innerHTML = s.sql;
        document.getElementById("note").innerHTML = s.note;
      }

      document.getElementById("scenarios").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        show(b.dataset.id);
      });

      show("add-col");
    </script>
  </body>
</html>
