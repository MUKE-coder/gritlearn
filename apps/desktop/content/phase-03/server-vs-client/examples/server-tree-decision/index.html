<!--
  A flowchart you walk through for any component. Six yes/no
  questions; arrive at server or client with reasoning.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Server or client? — decision tree</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; line-height: 1.55; color: #18181b; }
      h1 { font-size: 1.3rem; }
      .step {
        border: 1px solid #e4e4e7; border-radius: 8px; padding: 0.95rem 1.1rem;
        background: #fafafa; margin-top: 1rem;
      }
      .step.active { border-color: #15803d; background: #ecfdf5; }
      .step .num {
        display: inline-block; width: 1.6rem; height: 1.6rem; line-height: 1.6rem; text-align: center;
        background: #15803d; color: #fff; border-radius: 999px; font-weight: 700; font-size: 0.85rem;
        margin-right: 0.5rem;
      }
      .q { font-weight: 600; }
      .actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
      .actions button {
        padding: 0.4rem 0.95rem; border-radius: 4px; cursor: pointer;
        font-family: ui-monospace, monospace; font-size: 0.85rem; font-weight: 600;
        border: 1px solid; background: #fff;
      }
      .actions button.yes { border-color: #dc2626; color: #b91c1c; }
      .actions button.yes:hover { background: #fef2f2; }
      .actions button.no  { border-color: #16a34a; color: #166534; }
      .actions button.no:hover { background: #ecfdf5; }
      .reset {
        padding: 0.4rem 0.95rem; border: 1px solid #d4d4d8; border-radius: 4px;
        background: #fff; color: #71717a; cursor: pointer; font-family: ui-monospace, monospace;
        font-size: 0.82rem;
      }
      .verdict {
        font-family: ui-monospace, monospace;
        margin-top: 1.5rem; padding: 1rem 1.3rem; border-radius: 8px;
        font-size: 1rem; font-weight: 700; text-align: center;
      }
      .verdict.server { background: #ecfdf5; color: #166534; border: 2px solid #16a34a; }
      .verdict.client { background: #fef3c7; color: #92400e; border: 2px solid #b45309; }
      .verdict p { font-weight: 400; margin: 0.5rem 0 0; font-size: 0.88rem; }
    </style>
  </head>
  <body>
    <h1>Should this component be server or client?</h1>
    <p>Run through the six questions for any component you're about to write. Click YES or NO at each step.</p>

    <div id="steps"></div>
    <div id="verdict"></div>
    <button class="reset" id="reset" style="margin-top: 1.5rem;">start over</button>

    <script>
      const questions = [
        { q: "Does it use `useState`, `useReducer`, `useRef`, or any React state hook?",
          yes: "client", reason: "State hooks only work in client components." },
        { q: "Does it use `useEffect` or another effect hook?",
          yes: "client", reason: "Effect hooks only work in the browser." },
        { q: "Does it attach `onClick`, `onChange`, `onSubmit`, or other browser event handlers?",
          yes: "client", reason: "Event handlers run in the browser." },
        { q: "Does it access `window`, `document`, `localStorage`, or other browser APIs?",
          yes: "client", reason: "Browser APIs only exist in the browser." },
        { q: "Does it use a third-party library that requires hooks (Zustand, React Query, Framer Motion, etc.)?",
          yes: "client", reason: "Hook-based libraries need a client component to use." },
        { q: "Could it just `await` data from a database or API directly?",
          yes: "server", reason: "Async data fetching at the top of the body is a server-component feature.",
          no:  "server-default", reason: "Default to server unless you have a specific need." },
      ];

      let step = 0;
      let answers = [];
      let verdict = null;

      function render() {
        const stepsEl = document.getElementById("steps");
        const verdictEl = document.getElementById("verdict");
        stepsEl.innerHTML = "";
        for (let i = 0; i <= step && !verdict; i++) {
          if (i >= questions.length) break;
          const q = questions[i];
          const isActive = i === step;
          const ans = answers[i];
          const stepDiv = document.createElement("div");
          stepDiv.className = "step" + (isActive ? " active" : "");
          stepDiv.innerHTML = `
            <div><span class="num">${i + 1}</span><span class="q">${q.q}</span></div>
            ${isActive ? `
              <div class="actions">
                <button class="yes" data-i="${i}" data-a="yes">YES → ${q.yes}</button>
                <button class="no"  data-i="${i}" data-a="no">NO  → continue</button>
              </div>
            ` : ans ? `<div style="margin-top:0.4rem;font-size:0.85rem;color:#71717a;">You answered: <strong>${ans.toUpperCase()}</strong></div>` : ""}
          `;
          stepsEl.appendChild(stepDiv);
        }
        stepsEl.querySelectorAll("button[data-a]").forEach((b) => {
          b.addEventListener("click", () => answer(b.dataset.a));
        });

        if (verdict) {
          verdictEl.innerHTML = `
            <div class="verdict ${verdict.kind}">
              ${verdict.kind === "server" ? "✓ SERVER COMPONENT" : "✓ CLIENT COMPONENT (needs \"use client\")"}
              <p>${verdict.reason}</p>
            </div>
          `;
        } else {
          verdictEl.innerHTML = "";
        }
      }

      function answer(a) {
        answers[step] = a;
        const q = questions[step];
        if (a === "yes") {
          if (q.yes === "client") {
            verdict = { kind: "client", reason: q.reason };
          } else {
            verdict = { kind: "server", reason: q.reason };
          }
        } else {
          // no
          if (step === questions.length - 1) {
            verdict = { kind: "server", reason: q.reason };
          } else {
            step += 1;
          }
        }
        render();
      }

      document.getElementById("reset").addEventListener("click", () => {
        step = 0;
        answers = [];
        verdict = null;
        render();
      });

      render();
    </script>
  </body>
</html>
