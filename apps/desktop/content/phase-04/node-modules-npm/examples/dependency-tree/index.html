<!--
  Visualise what 'npm install express' actually installs. Tree of
  Express's direct deps and transitive deps. Click a node to see what
  the package does. Makes 'I asked for 1 package, got 60' concrete.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>What 'npm install express' actually installs</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 1080px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #18181b; }
      h1 { font-size: 1.3rem; }
      .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1rem; margin-top: 1rem; }
      .col { border: 1px solid #e4e4e7; border-radius: 8px; padding: 0.9rem; background: #fafafa; }
      .col h2 {
        margin: 0 0 0.6rem; font-size: 0.74rem; text-transform: uppercase;
        letter-spacing: 0.08em; color: #71717a;
      }

      .stat-row {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
        margin-bottom: 0.8rem;
      }
      .stat {
        background: #fff; border: 1px solid #e4e4e7; border-radius: 6px;
        padding: 0.55rem 0.8rem; text-align: center;
      }
      .stat .n {
        font-size: 1.4rem; font-weight: 700; font-family: ui-monospace, monospace;
        color: #15803d;
      }
      .stat .lbl {
        font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em;
        color: #71717a;
      }

      .tree {
        font-family: ui-monospace, monospace; font-size: 0.82rem;
        line-height: 1.55; max-height: 28rem; overflow-y: auto;
      }
      .tree .row {
        padding: 0.18rem 0.35rem; cursor: pointer; border-radius: 3px;
        white-space: nowrap;
      }
      .tree .row:hover { background: #f4f4f5; }
      .tree .row.active { background: #ecfdf5; border-left: 3px solid #16a34a; color: #166534; font-weight: 600; }
      .tree .row .name { color: #18181b; }
      .tree .row .ver  { color: #71717a; margin-left: 0.4rem; font-size: 0.78rem; }
      .tree .row.direct .name { color: #15803d; }
      .tree .row.transitive .name { color: #18181b; }

      pre {
        background: #0a0a0d; color: #ededee; padding: 0.7rem 0.85rem; border-radius: 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.78rem;
        line-height: 1.55; margin: 0; overflow-x: auto;
      }
      .keyword { color: #38bdf8; }
      .string  { color: #7fff5b; }
      .comment { color: #71717a; font-style: italic; }

      .panel h3 { margin: 0; font-size: 1rem; }
      .panel .meta {
        font-family: ui-monospace, monospace; color: #71717a; font-size: 0.78rem;
        margin: 0.2rem 0 0.6rem;
      }
      .panel .purpose {
        margin-top: 0.5rem; font-size: 0.86rem; padding: 0.55rem 0.8rem;
        background: #ecfdf5; border-left: 3px solid #16a34a; color: #166534;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>What <code>npm install express</code> actually installs</h1>
    <p>You asked for one package. You got a tree. Click any sub-dependency to see what it does and why Express needs it.</p>

    <div class="stat-row">
      <div class="stat"><div class="n">1</div><div class="lbl">You asked for</div></div>
      <div class="stat"><div class="n">28</div><div class="lbl">Transitive deps</div></div>
      <div class="stat"><div class="n">~2.1 MB</div><div class="lbl">Total install size</div></div>
    </div>

    <div class="grid">
      <div class="col">
        <h2>Dependency tree</h2>
        <div class="tree" id="tree"></div>
      </div>
      <div class="col">
        <h2>Package detail</h2>
        <div class="panel" id="panel"></div>
      </div>
    </div>

    <script>
      // Approximated Express 4.x dep tree. Real npm install picks
      // current sub-versions; this is shaped for teaching.
      const packages = {
        express: {
          version: "4.21.0",
          purpose: "Web framework — adds routing, middleware, and request/response helpers on top of Node's http module. The thing you actually wanted.",
          why: "You asked for it.",
          direct: true,
          children: ["accepts", "body-parser", "cookie", "cookie-signature", "debug", "depd", "encodeurl", "etag", "finalhandler", "fresh", "merge-descriptors", "methods", "on-finished", "parseurl", "path-to-regexp", "proxy-addr", "qs", "range-parser", "router", "send", "serve-static", "setprototypeof", "statuses", "type-is", "utils-merge", "vary"],
        },
        "accepts":         { version: "1.3.8",  purpose: "Negotiates the response Content-Type based on the request's Accept header.", why: "Used by Express's res.format() and res.send() to pick JSON / HTML / text.", children: ["mime-types", "negotiator"] },
        "body-parser":     { version: "1.20.3", purpose: "Parses incoming request bodies (JSON, urlencoded form data) into req.body.", why: "Express needs to read POST/PUT bodies before your handler runs.", children: ["bytes", "content-type", "iconv-lite"] },
        "cookie":          { version: "0.6.0",  purpose: "Serialises and parses HTTP cookie strings.", why: "Cookie reading + setting on req/res.", children: [] },
        "cookie-signature":{ version: "1.0.6",  purpose: "Signs cookies cryptographically so the client can't tamper with them.", why: "Express signs session cookies to prevent forgery.", children: [] },
        "debug":           { version: "4.3.7",  purpose: "Conditional logger that turns on via DEBUG env var.", why: "Almost every Node library uses it for verbose logs you opt in to.", children: ["ms"] },
        "depd":            { version: "2.0.0",  purpose: "Marks library functions as deprecated with a warning message.", why: "Express deprecates old method names without breaking them.", children: [] },
        "encodeurl":       { version: "2.0.0",  purpose: "URL-encodes a string without double-encoding already-encoded characters.", why: "Express uses it for redirects + location headers.", children: [] },
        "etag":            { version: "1.8.1",  purpose: "Generates an ETag header (hash of the response body) for caching.", why: "Express auto-generates ETags so browsers can 304 cached responses.", children: [] },
        "finalhandler":    { version: "1.3.1",  purpose: "Default error handler — formats unhandled errors as 500 responses.", why: "Catches anything that escapes your route handlers.", children: ["debug", "encodeurl", "escape-html", "on-finished", "parseurl", "statuses", "unpipe"] },
        "fresh":           { version: "0.5.2",  purpose: "Compares request headers (If-Modified-Since, If-None-Match) to determine if a cache is still valid.", why: "Powers Express's 304 Not Modified responses.", children: [] },
        "merge-descriptors":{ version:"1.0.3",  purpose: "Merges property descriptors from one object into another.", why: "Internal helper for app.use() to assemble middleware.", children: [] },
        "methods":         { version: "1.1.2",  purpose: "List of HTTP methods (GET, POST, PUT, DELETE, etc).", why: "Express maps each to a router method (app.get, app.post, etc).", children: [] },
        "on-finished":     { version: "2.4.1",  purpose: "Fires a callback when an HTTP request or response finishes.", why: "Used for cleanup (close streams, finalise logs).", children: ["ee-first"] },
        "parseurl":        { version: "1.3.3",  purpose: "Parses a URL with caching so repeated parses are cheap.", why: "Express parses req.url on every middleware call.", children: [] },
        "path-to-regexp":  { version: "0.1.10", purpose: "Compiles Express-style URL patterns ('/users/:id') into RegExps.", why: "Powers the route matcher.", children: [] },
        "proxy-addr":      { version: "2.0.7",  purpose: "Determines the real client IP from the X-Forwarded-For header.", why: "Used when Express sits behind a reverse proxy.", children: ["forwarded", "ipaddr.js"] },
        "qs":              { version: "6.13.0", purpose: "Parses query strings (?a=1&b=2) into nested objects.", why: "Powers req.query.", children: ["side-channel"] },
        "range-parser":    { version: "1.2.1",  purpose: "Parses HTTP Range headers (for partial file downloads).", why: "Express's res.sendFile() supports Range responses for video/audio streaming.", children: [] },
        "router":          { version: "1.x",    purpose: "Modular routing layer used by Express's app.use, app.get, etc.", why: "Self-explanatory — handles every URL match.", children: [] },
        "send":            { version: "0.19.0", purpose: "Streams files as HTTP responses with caching headers.", why: "Powers res.sendFile() and res.download().", children: ["debug", "destroy", "encodeurl", "escape-html", "etag", "fresh", "http-errors", "mime", "ms", "on-finished", "range-parser", "statuses"] },
        "serve-static":    { version: "1.16.2", purpose: "Express middleware to serve a directory of static files.", why: "Used by express.static(); the next concept covers it.", children: ["encodeurl", "escape-html", "parseurl", "send"] },
        "setprototypeof":  { version: "1.2.0",  purpose: "Polyfill for Object.setPrototypeOf in older Node versions.", why: "Express's class hierarchy uses it; harmless on modern Node.", children: [] },
        "statuses":        { version: "2.0.1",  purpose: "Mapping between HTTP status codes and their reason strings.", why: "Used by res.status(404).send(); reads the message from this table.", children: [] },
        "type-is":         { version: "1.6.18", purpose: "Checks if a request's Content-Type matches some media type.", why: "Body parser uses it to decide if a request is JSON, form, etc.", children: ["media-typer", "mime-types"] },
        "utils-merge":     { version: "1.0.1",  purpose: "Merges properties of one object into another.", why: "Tiny helper, used internally.", children: [] },
        "vary":            { version: "1.1.2",  purpose: "Manages the Vary HTTP header (signal to caches which request headers affect the response).", why: "Express sets Vary on CORS-affected responses.", children: [] },
        "mime-types":      { version: "2.1.35", purpose: "Maps file extensions ↔ MIME types.", why: "Used by accepts + type-is to negotiate content types.", children: ["mime-db"] },
        "mime-db":         { version: "1.52.0", purpose: "Authoritative source for the file-extension → MIME type table.", why: "Underpins mime-types.", children: [] },
      };

      let selected = "express";

      function renderTree() {
        const lines = [];
        function walk(name, prefix, isLast, visited) {
          if (visited.has(name)) return;
          visited.add(name);
          const pkg = packages[name];
          const ver = pkg ? pkg.version : "?";
          const direct = pkg && pkg.direct;
          const branch = prefix === "" ? "" : (isLast ? "└─ " : "├─ ");
          lines.push({
            name,
            display: `${prefix}${branch}<span class="name">${name}</span><span class="ver">${ver}</span>`,
            direct,
          });
          if (!pkg) return;
          const children = pkg.children || [];
          const nextPrefix = prefix === "" ? "" : prefix + (isLast ? "   " : "│  ");
          children.forEach((c, i) => walk(c, nextPrefix, i === children.length - 1, visited));
        }
        walk("express", "", true, new Set());

        document.getElementById("tree").innerHTML = lines.map(l => `
          <div class="row ${l.direct ? "direct" : "transitive"} ${l.name === selected ? "active" : ""}" data-name="${l.name}">
            ${l.display}
          </div>
        `).join("");
      }

      function renderPanel() {
        const p = packages[selected];
        if (!p) return;
        document.getElementById("panel").innerHTML = `
          <h3>${selected}</h3>
          <div class="meta">v${p.version}${p.direct ? " · direct dep" : " · transitive"}</div>
          <pre>npm install ${selected}</pre>
          <p>${p.purpose}</p>
          <div class="purpose"><strong>Why Express pulls this in:</strong> ${p.why}</div>
          ${p.children && p.children.length ? `<p style="font-size:0.8rem;color:#71717a;margin-top:0.5rem;">Has ${p.children.length} sub-dep${p.children.length === 1 ? "" : "s"}: ${p.children.slice(0, 8).join(", ")}${p.children.length > 8 ? "…" : ""}</p>` : ""}
        `;
      }

      document.getElementById("tree").addEventListener("click", (e) => {
        const r = e.target.closest(".row");
        if (!r) return;
        selected = r.dataset.name;
        renderTree();
        renderPanel();
      });

      renderTree();
      renderPanel();
    </script>
  </body>
</html>
