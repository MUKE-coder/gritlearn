<!--
  makeUser factory — closure-as-encapsulation.

  The returned object only exposes getters and one mutator. Trying to
  read u.name / u.active returns undefined. Open the console after the
  page loads and try it yourself.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Closure-as-encapsulation</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1rem; line-height: 1.55; color: #18181b; }
      h1 { font-size: 1.3rem; }
      .card {
        border: 1px solid #e4e4e7; border-radius: 8px; padding: 1.25rem;
        background: #fafafa; margin-top: 1rem;
      }
      .name { font-size: 1.1rem; font-weight: 600; }
      .status { font-family: ui-monospace, monospace; font-size: 0.85rem; margin-top: 0.25rem; }
      .status.active   { color: #15803d; }
      .status.inactive { color: #b91c1c; }
      button {
        margin-top: 0.75rem; padding: 0.45rem 0.85rem; border-radius: 6px;
        border: 1px solid #d4d4d8; background: #fff; cursor: pointer; font-weight: 600;
      }
      button:hover { background: #f4f4f5; }
      pre {
        background: #0a0a0d; color: #ededee; padding: 0.85rem 1rem; border-radius: 6px;
        margin-top: 1.5rem; font-family: ui-monospace, monospace; font-size: 0.85rem; line-height: 1.55;
      }
      .ok { color: #7fff5b; } .bad { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>Private fields via closures</h1>
    <p>The returned object exposes only the methods. <code>name</code> and <code>active</code> live in the closure's backpack — there's no <code>u.name</code> to read.</p>

    <div class="card">
      <div class="name" id="name">…</div>
      <div class="status" id="status">…</div>
      <button id="toggle">Deactivate</button>
    </div>

    <pre id="probe"></pre>

    <script>
      function makeUser(name) {
        let active = true;
        return {
          getName:    () => name,
          isActive:   () => active,
          deactivate: () => { active = false; },
          reactivate: () => { active = true; },
        };
      }

      const u = makeUser("Ada Lovelace");
      window.u = u;   // so you can poke at it in devtools

      const nameEl = document.getElementById("name");
      const statusEl = document.getElementById("status");
      const btn = document.getElementById("toggle");
      const probe = document.getElementById("probe");

      function render() {
        nameEl.textContent = u.getName();
        const live = u.isActive();
        statusEl.textContent = live ? "● active" : "● inactive";
        statusEl.className = "status " + (live ? "active" : "inactive");
        btn.textContent = live ? "Deactivate" : "Reactivate";
      }

      btn.addEventListener("click", () => {
        if (u.isActive()) u.deactivate(); else u.reactivate();
        render();
      });

      // Show that the private fields are unreachable.
      probe.innerHTML =
        "<span class='ok'>$</span> u.getName()      → " + JSON.stringify(u.getName()) + "\n" +
        "<span class='ok'>$</span> u.isActive()     → " + JSON.stringify(u.isActive()) + "\n" +
        "<span class='bad'>$</span> u.name            → " + JSON.stringify(u.name) + "  (no public field)\n" +
        "<span class='bad'>$</span> u.active          → " + JSON.stringify(u.active) + "  (no public field)\n" +
        "<span class='bad'>$</span> Object.keys(u)    → " + JSON.stringify(Object.keys(u));

      render();
    </script>
  </body>
</html>
