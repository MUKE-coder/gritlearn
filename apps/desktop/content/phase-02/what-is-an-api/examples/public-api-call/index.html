<!--
  Real public API call — GitHub user lookup. One fetch, render the
  profile, demonstrate that "calling an API" is fundamentally just
  fetch + parse + render.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Real API call — GitHub user lookup</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 620px; margin: 3rem auto; padding: 0 1rem; line-height: 1.55; color: #18181b; }
      h1 { font-size: 1.3rem; }
      .form { display: flex; gap: 0.5rem; margin-top: 1rem; }
      .form input {
        flex: 1; padding: 0.55rem 0.85rem; border: 1px solid #d4d4d8; border-radius: 6px;
        font-size: 0.92rem;
      }
      .form button {
        padding: 0.55rem 1.1rem; border-radius: 6px; border: 1px solid #15803d;
        background: #15803d; color: #fff; cursor: pointer; font-weight: 600; font-size: 0.9rem;
      }
      .profile {
        margin-top: 1.5rem; border: 1px solid #e4e4e7; border-radius: 8px; padding: 1rem;
        background: #fafafa; display: flex; gap: 1rem; align-items: center;
      }
      .profile img { width: 80px; height: 80px; border-radius: 50%; }
      .profile .name { font-size: 1.05rem; font-weight: 600; }
      .profile .meta { color: #71717a; font-size: 0.88rem; }
      .profile .stats { display: flex; gap: 1rem; margin-top: 0.4rem; font-size: 0.85rem; }
      .stats span { background: #fff; border: 1px solid #e4e4e7; padding: 2px 8px; border-radius: 4px; }
      .err { color: #b91c1c; padding: 0.6rem; background: #fef2f2; border-left: 3px solid #dc2626; border-radius: 4px; margin-top: 1rem; }
      pre.raw {
        background: #0a0a0d; color: #ededee; padding: 0.8rem 1rem; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.78rem; line-height: 1.55;
        max-height: 12rem; overflow: auto; margin-top: 1rem;
      }
      .accent { color: #71717a; font-size: 0.85rem; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>GitHub user lookup — one real fetch</h1>
    <p>Type a GitHub username. The browser hits the public GitHub API. The result is rendered below.</p>

    <div class="form">
      <input id="u" type="text" value="octocat" placeholder="github username" />
      <button id="go">Look up</button>
    </div>

    <div id="out"></div>
    <p class="accent">Open devtools → Network → click the request to <code>api.github.com</code> to see the headers and full response.</p>

    <script>
      const out = document.getElementById("out");
      async function lookup(username) {
        out.innerHTML = "<p>…looking up…</p>";
        try {
          const res = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);
          if (res.status === 404) {
            out.innerHTML = `<div class="err">404 — user "${username}" not found</div>`;
            return;
          }
          if (!res.ok) {
            out.innerHTML = `<div class="err">${res.status} ${res.statusText}</div>`;
            return;
          }
          const user = await res.json();
          out.innerHTML = `
            <div class="profile">
              <img src="${user.avatar_url}" alt="${user.login}" />
              <div>
                <div class="name">${user.name || user.login}</div>
                <div class="meta">@${user.login}${user.company ? " · " + user.company : ""}</div>
                <div class="stats">
                  <span>${user.followers} followers</span>
                  <span>${user.following} following</span>
                  <span>${user.public_repos} repos</span>
                </div>
              </div>
            </div>
            <pre class="raw">${JSON.stringify(user, null, 2)}</pre>
          `;
        } catch (e) {
          out.innerHTML = `<div class="err">network error: ${e.message}</div>`;
        }
      }
      document.getElementById("go").addEventListener("click", () => {
        lookup(document.getElementById("u").value.trim());
      });
      lookup("octocat");
    </script>
  </body>
</html>
