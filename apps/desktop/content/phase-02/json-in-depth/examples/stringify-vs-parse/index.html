<!--
  Round-trip explorer. Type a JS expression, evaluate it, stringify it,
  parse the result, render both sides. The diff makes lossy conversions
  visible.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Round-trip — what survives JSON?</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 820px; margin: 3rem auto; padding: 0 1rem; line-height: 1.55; color: #18181b; }
      h1 { font-size: 1.3rem; }
      textarea {
        width: 100%; box-sizing: border-box; padding: 0.65rem 0.85rem;
        border: 1px solid #d4d4d8; border-radius: 6px; font-family: ui-monospace, monospace;
        font-size: 0.88rem; min-height: 4rem; margin-top: 0.5rem;
      }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
      .row button {
        padding: 0.4rem 0.8rem; border: 1px solid #d4d4d8; border-radius: 4px;
        background: #fff; cursor: pointer; font-size: 0.82rem; font-family: ui-monospace, monospace;
      }
      .row button:hover { background: #f4f4f5; }
      .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; margin-top: 1rem; }
      .col { border: 1px solid #e4e4e7; border-radius: 8px; padding: 0.85rem; background: #fafafa; }
      .col h2 { margin: 0 0 0.4rem; font-size: 0.85rem; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
      pre {
        background: #0a0a0d; color: #ededee; padding: 0.55rem 0.7rem; border-radius: 4px;
        font-family: ui-monospace, monospace; font-size: 0.82rem; min-height: 5rem;
        line-height: 1.5; margin: 0; white-space: pre-wrap; overflow-x: auto;
      }
      .same { background: #ecfdf5; border-left: 3px solid #16a34a; padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.85rem; margin-top: 0.5rem; color: #166534; }
      .diff { background: #fef2f2; border-left: 3px solid #dc2626; padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.85rem; margin-top: 0.5rem; color: #991b1b; }
      .err { color: #b91c1c; font-family: ui-monospace, monospace; font-size: 0.85rem; padding: 0.4rem; background: #fef2f2; border-radius: 4px; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Round-trip — what survives JSON?</h1>
    <p>Type a JS expression below. The page evaluates it, stringifies it, parses the result, and shows both sides. Compare!</p>

    <label style="display: block; font-size: 0.85rem; color: #555;">JS expression:</label>
    <textarea id="src">({
  id: 47,
  name: "Ada",
  active: true,
  created: new Date("2026-06-15"),
  score: NaN,
  notes: undefined,
  fn: () => "hi",
  tags: ["new", "vip"],
})</textarea>

    <div class="row">
      <button data-snippet='({ id: 47, name: "Ada" })'>simple object</button>
      <button data-snippet='[1, 2, 3]'>array</button>
      <button data-snippet='({ at: new Date() })'>Date</button>
      <button data-snippet='({ a: undefined, b: null })'>undefined vs null</button>
      <button data-snippet='[1, undefined, 3]'>undefined in array</button>
      <button data-snippet='({ big: 9007199254740993 })'>integer overflow</button>
    </div>

    <div class="grid">
      <div class="col">
        <h2>1. Original (in memory)</h2>
        <pre id="original">…</pre>
      </div>
      <div class="col">
        <h2>2. JSON text (on wire)</h2>
        <pre id="text">…</pre>
      </div>
      <div class="col">
        <h2>3. Parsed back (different in-memory)</h2>
        <pre id="parsed">…</pre>
      </div>
    </div>
    <div id="verdict"></div>

    <script>
      const srcEl = document.getElementById("src");
      const origEl = document.getElementById("original");
      const textEl = document.getElementById("text");
      const parsedEl = document.getElementById("parsed");
      const verdictEl = document.getElementById("verdict");

      function describe(v) {
        if (v === undefined) return "undefined";
        if (v === null)      return "null";
        if (typeof v === "function") return "[function]";
        if (typeof v === "object") {
          if (Array.isArray(v)) return JSON.stringify(v.map(describe), null, 2).replaceAll('"', "");
          // try a friendlier dump that shows undefined/function explicitly
          const obj = {};
          for (const k of Object.keys(v)) obj[k] = describe(v[k]);
          return JSON.stringify(obj, null, 2).replaceAll('"', "");
        }
        if (typeof v === "number" && Number.isNaN(v)) return "NaN";
        if (v instanceof Date) return "Date(" + v.toISOString() + ")";
        return JSON.stringify(v);
      }

      function run() {
        const src = srcEl.value.trim();
        verdictEl.innerHTML = "";
        try {
          // eslint-disable-next-line no-eval
          const value = eval(src);
          origEl.textContent = describe(value);

          const text = JSON.stringify(value, null, 2);
          textEl.textContent = text;

          const reparsed = JSON.parse(text);
          parsedEl.textContent = describe(reparsed);

          // Compare reparsed against original via stringify (rough but useful)
          const sameShape = JSON.stringify(reparsed) === JSON.stringify(value);
          verdictEl.innerHTML = sameShape
            ? `<div class="same">✓ Round-trip preserved the shape. (Note: types like Date became strings — same JSON, different runtime types.)</div>`
            : `<div class="diff">⚠ Round-trip changed the shape. Fields were dropped or values converted (look for undefined, NaN, functions, Dates).</div>`;
        } catch (e) {
          origEl.textContent = "(error evaluating)";
          textEl.textContent = "—";
          parsedEl.textContent = "—";
          verdictEl.innerHTML = `<div class="err">Eval error: ${e.message}</div>`;
        }
      }

      srcEl.addEventListener("input", run);
      document.querySelectorAll("button[data-snippet]").forEach((b) => {
        b.addEventListener("click", () => {
          srcEl.value = b.dataset.snippet;
          run();
        });
      });
      run();
    </script>
  </body>
</html>
