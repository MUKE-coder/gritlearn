<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>An object editor</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .key { font-family: ui-monospace, monospace; color: #4763e4; font-weight: 600; min-width: 80px; }
      .val { flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; }
      .del { padding: 4px 8px; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 4px; cursor: pointer; font-size: 11px; }
      .add { display: flex; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
      .add input { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; }
      .add button { padding: 6px 12px; background: #4763e4; color: white; border: 0; border-radius: 6px; font-size: 12px; cursor: pointer; }
      pre { background: #1c2230; color: #e6edf3; padding: 14px; border-radius: 8px; font-size: 12px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <h1>Live object editor</h1>
    <p>Edit any value, delete a property, or add a new one. The JSON preview updates in real time.</p>

    <div class="card" id="editor"></div>

    <h2 style="margin-top: 24px; font-size: 14px;">Current object</h2>
    <pre id="preview"></pre>

    <script>
      const user = {
        name: "Aisha",
        age: 22,
        city: "Lisbon",
        active: true,
      };

      const editor = document.getElementById("editor");
      const preview = document.getElementById("preview");

      function render() {
        editor.innerHTML = Object.entries(user).map(([k, v]) =>
          `<div class="row">
            <span class="key">${k}</span>
            <input class="val" data-key="${k}" value="${String(v)}" />
            <button class="del" data-key="${k}">✕</button>
          </div>`
        ).join("") + `
          <div class="add">
            <input id="newK" placeholder="new key" style="width: 100px;" />
            <input id="newV" placeholder="value" style="flex: 1;" />
            <button id="addBtn">+ add</button>
          </div>`;

        preview.textContent = JSON.stringify(user, null, 2);
      }

      editor.addEventListener("input", (e) => {
        const k = e.target.dataset.key;
        if (!k) return;
        // Try to parse as JSON literal; fall back to raw string.
        let v;
        try { v = JSON.parse(e.target.value); }
        catch { v = e.target.value; }
        user[k] = v;     // ← write a property
        preview.textContent = JSON.stringify(user, null, 2);
      });
      editor.addEventListener("click", (e) => {
        if (e.target.classList.contains("del")) {
          delete user[e.target.dataset.key];   // ← delete a property
          render();
        }
        if (e.target.id === "addBtn") {
          const k = document.getElementById("newK").value.trim();
          const vRaw = document.getElementById("newV").value;
          if (!k) return;
          let v;
          try { v = JSON.parse(vRaw); } catch { v = vRaw; }
          user[k] = v;                         // ← add a new property
          render();
        }
      });
      render();
    </script>
  </body>
</html>
