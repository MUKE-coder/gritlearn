<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A product card, all Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-md overflow-hidden max-w-sm group">
      <!-- Image -->
      <div class="aspect-square bg-gradient-to-br from-pink-200 via-purple-200 to-indigo-200 flex items-center justify-center overflow-hidden">
        <span class="text-6xl group-hover:scale-110 transition-transform duration-300">👟</span>
      </div>

      <!-- Body -->
      <div class="p-6">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs uppercase tracking-wider text-indigo-600 font-semibold">Sneakers</span>
          <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">In stock</span>
        </div>

        <h2 class="text-xl font-bold text-gray-900 mb-1">AirCloud Runner</h2>
        <p class="text-sm text-gray-600 mb-4">
          Lightweight, breathable mesh upper with a responsive foam midsole. Built for everyday miles.
        </p>

        <div class="flex items-baseline gap-2 mb-5">
          <span class="text-2xl font-bold text-gray-900">$129</span>
          <span class="text-sm text-gray-400 line-through">$159</span>
        </div>

        <div class="flex gap-2">
          <button class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition-colors">
            Add to cart
          </button>
          <button class="w-10 h-10 flex items-center justify-center border border-gray-300 hover:bg-gray-100 rounded-lg transition-colors text-gray-600" aria-label="Save">
            ♡
          </button>
        </div>
      </div>
    </div>

  </body>
</html>
