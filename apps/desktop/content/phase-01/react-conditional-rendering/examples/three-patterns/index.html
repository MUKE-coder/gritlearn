<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three conditional patterns</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 18px 0; }
      .pane { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; }
      .pane h2 { margin: 0 0 6px; font-family: ui-monospace, monospace; font-size: 12px; color: #4763e4; }
      pre { background: #1c2230; color: #e6edf3; padding: 10px; border-radius: 6px; font-size: 11px; line-height: 1.4; margin: 0 0 8px; overflow-x: auto; }
      .out { background: white; border: 1px dashed #d1d5db; border-radius: 6px; padding: 8px 10px; font-size: 13px; }
      .toggle { display: flex; gap: 10px; align-items: center; padding: 12px; background: #eef2ff; border-radius: 8px; }
      .toggle button { padding: 6px 12px; border: 0; background: #4763e4; color: white; border-radius: 6px; font-size: 12px; cursor: pointer; }
      .warn { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
      @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Three patterns, same job</h1>
    <p>One toggle drives three components. Each implements the same logic with a different syntax.</p>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function Ternary({ isAdmin }) {
        return <div className="out">{isAdmin ? "Admin view" : "User view"}</div>;
      }
      function AndShortCircuit({ hasNotif, count }) {
        return (
          <div className="out">
            Mailbox{" "}
            {hasNotif && <strong style={{color:'#4763e4'}}>· {count} new</strong>}
          </div>
        );
      }
      function EarlyReturn({ user }) {
        if (!user) return <div className="out">Please sign in.</div>;
        return <div className="out">Welcome, <strong>{user.name}</strong>!</div>;
      }
      function ZeroBug({ count }) {
        // The famous "renders 0" bug:
        return (
          <div className="out warn" style={{fontFamily:'ui-monospace, monospace'}}>
            {/* WRONG */}
            {count && <span>{count} new</span>}
            <br />
            {/* RIGHT */}
            {count > 0 && <span>{count} new</span>}
          </div>
        );
      }

      function App() {
        const [admin, setAdmin] = useState(true);
        const [hasNotif, setHasNotif] = useState(true);
        const [signed, setSigned] = useState(true);
        const [count, setCount] = useState(0);

        return (
          <>
            <div className="row">
              <div className="pane">
                <h2>1. ternary</h2>
                <pre>{`{isAdmin ? "Admin" : "User"}`}</pre>
                <Ternary isAdmin={admin} />
                <div className="toggle" style={{marginTop:8}}>
                  isAdmin: <strong>{String(admin)}</strong>
                  <button onClick={() => setAdmin((v) => !v)}>flip</button>
                </div>
              </div>

              <div className="pane">
                <h2>2. &amp;&amp; short-circuit</h2>
                <pre>{`{hasNotif && <Bell />}`}</pre>
                <AndShortCircuit hasNotif={hasNotif} count={3} />
                <div className="toggle" style={{marginTop:8}}>
                  hasNotif: <strong>{String(hasNotif)}</strong>
                  <button onClick={() => setHasNotif((v) => !v)}>flip</button>
                </div>
              </div>

              <div className="pane">
                <h2>3. early return</h2>
                <pre>{`if (!user) return <X />;
return <Y />;`}</pre>
                <EarlyReturn user={signed ? {name:"Aisha"} : null} />
                <div className="toggle" style={{marginTop:8}}>
                  signedIn: <strong>{String(signed)}</strong>
                  <button onClick={() => setSigned((v) => !v)}>flip</button>
                </div>
              </div>
            </div>

            <h2>The famous 0-bug</h2>
            <pre>{`{count && <span>...</span>}      ← when count is 0, React renders the literal "0"
{count > 0 && <span>...</span>}  ← correct: explicit comparison`}</pre>
            <ZeroBug count={count} />
            <div className="toggle" style={{marginTop:8}}>
              count: <strong>{count}</strong>
              <button onClick={() => setCount(0)}>0</button>
              <button onClick={() => setCount(3)}>3</button>
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
