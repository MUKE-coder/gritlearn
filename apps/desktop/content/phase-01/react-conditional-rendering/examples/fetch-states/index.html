<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Four fetch states</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      .controls button { padding: 6px 12px; border: 1px solid #d1d5db; background: white; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: ui-monospace, monospace; }
      .controls button:hover { background: #4763e4; color: white; border-color: #4763e4; }
      .panel { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; min-height: 180px; }
      .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #4763e4; border-radius: 50%; animation: spin 800ms linear infinite; margin: 30px auto; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .err { padding: 14px; background: #fef2f2; border-left: 4px solid #ef4444; border-radius: 0 6px 6px 0; color: #b91c1c; }
      .empty { text-align: center; padding: 30px; color: #6b7280; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { padding: 10px 12px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; margin: 4px 0; }
    </style>
  </head>
  <body>
    <h1>Loading / error / empty / data</h1>
    <p>The four states every data-fetching component goes through. Click each button to trigger the corresponding render path.</p>

    <div id="root"></div>

    <script type="text/babel">
      function UserList({ state, users, error }) {
        // ── Early returns dispatch each non-happy case ──
        if (state === "loading") return <div className="spinner" aria-label="Loading"></div>;
        if (state === "error")   return <div className="err">Failed to load: {error}</div>;
        if (users.length === 0)  return <div className="empty">No users yet.<br/><small>Try inviting some.</small></div>;

        // ── Happy path: no nesting ──
        return (
          <ul>
            {users.map((u) => <li key={u.id}>{u.name}</li>)}
          </ul>
        );
      }

      const { useState } = React;
      function App() {
        const [state, setState] = useState("loading");

        const cases = {
          loading: { state: "loading", users: [],    error: null },
          error:   { state: "error",   users: [],    error: "network timeout" },
          empty:   { state: "ok",      users: [],    error: null },
          data:    { state: "ok",      users: [
            { id: 1, name: "Aisha Nakato" },
            { id: 2, name: "Brian Kim" },
            { id: 3, name: "Daniel Reyes" },
          ], error: null },
        };
        const current = cases[state];

        return (
          <>
            <div className="controls">
              <button onClick={() => setState("loading")}>loading</button>
              <button onClick={() => setState("error")}>error</button>
              <button onClick={() => setState("empty")}>empty</button>
              <button onClick={() => setState("data")}>data</button>
            </div>
            <div className="panel">
              <UserList {...current} />
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
