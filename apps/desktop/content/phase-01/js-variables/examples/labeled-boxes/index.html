<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Variables in action</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin: 12px 0; }
      .label { font-family: ui-monospace, monospace; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; }
      .value { font-family: ui-monospace, monospace; font-size: 16px; color: #4763e4; margin: 4px 0 0; }
      button { padding: 8px 14px; background: #4763e4; color: white; border: 0; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
      button:hover { background: #3a53c6; }
      button.danger { background: #dc2626; }
      button.danger:hover { background: #b91c1c; }
      .console { background: #1c2230; color: #e6edf3; border-radius: 8px; padding: 14px; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5; min-height: 60px; }
      .err { color: #f87171; }
      .ok { color: #4ade80; }
    </style>
  </head>
  <body>
    <h1>Variables in action</h1>
    <p style="color: #6b7280; font-size: 14px;">Click each button. Watch the values and console below.</p>

    <div class="card">
      <div class="label">let counter (mutable)</div>
      <div class="value" id="counterDisplay">0</div>
      <button id="bumpCounter">counter = counter + 1</button>
    </div>

    <div class="card">
      <div class="label">const name (frozen binding)</div>
      <div class="value" id="nameDisplay">"Aisha"</div>
      <button class="danger" id="tryReassign">Try: name = "Brian"  (will fail)</button>
    </div>

    <div class="card">
      <div class="label">Console output</div>
      <div class="console" id="log">(click a button above)</div>
    </div>

    <script>
      // ── A mutable variable, declared with let ──
      let counter = 0;
      // ── An immutable binding, declared with const ──
      const name = "Aisha";

      const counterEl = document.getElementById("counterDisplay");
      const nameEl    = document.getElementById("nameDisplay");
      const logEl     = document.getElementById("log");

      function log(html) {
        logEl.innerHTML = html;
      }

      document.getElementById("bumpCounter").addEventListener("click", () => {
        counter = counter + 1;           // ← LET supports reassignment
        counterEl.textContent = counter;
        log(`<span class="ok">✓ counter = ${counter}</span>`);
      });

      document.getElementById("tryReassign").addEventListener("click", () => {
        try {
          // Attempting to reassign a const throws a TypeError.
          // We use eval to dodge the syntax error at parse time.
          eval('name = "Brian"');
        } catch (err) {
          log(`<span class="err">✗ ${err.name}: ${err.message}</span>
            <br /><span style="color: #aeb9c7;">const freezes the binding — you can't reassign the variable.</span>`);
        }
      });
    </script>
  </body>
</html>
