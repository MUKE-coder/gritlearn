<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Six common events, live</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .panel { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
      .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
      input, button { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
      button { background: #4763e4; color: white; border: 0; font-weight: 600; cursor: pointer; }
      button:hover { background: #3a53c6; }
      form { display: flex; gap: 6px; }
      form input { flex: 1; }
      .hover-box { padding: 10px; background: #fef3c7; border: 1px dashed #f59e0b; border-radius: 6px; text-align: center; cursor: pointer; }
      .log { background: #1c2230; color: #e6edf3; padding: 12px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 12px; height: 200px; overflow-y: auto; }
      .log .ts { color: #6e7b8e; }
      .log .ev { color: #58a6ff; }
    </style>
  </head>
  <body>
    <h1>Six common events</h1>
    <p>Interact with the controls below — each event fires and gets logged in the panel.</p>

    <div class="panel">
      <div class="row">
        <button id="btn">click me</button>
        <input id="text" placeholder="type something..." />
      </div>
      <form id="form">
        <input id="formIn" placeholder="press Enter to submit" />
        <button>submit</button>
      </form>
      <div id="hover" class="hover-box" tabindex="0">hover or click this box</div>
    </div>

    <h2 style="margin-top: 22px; font-size: 14px;">Event log</h2>
    <div id="log" class="log">(events appear here)</div>

    <script>
      const logEl = document.getElementById("log");
      let count = 0;
      function log(name, detail = "") {
        count++;
        const div = document.createElement("div");
        div.innerHTML = `<span class="ts">#${String(count).padStart(3,"0")}</span> <span class="ev">${name}</span> ${detail}`;
        logEl.prepend(div);
      }

      document.getElementById("btn").addEventListener("click", () => log("click"));
      document.getElementById("text").addEventListener("input", (e) =>
        log("input", `value="${e.target.value}"`));
      document.getElementById("text").addEventListener("change", (e) =>
        log("change", `committed="${e.target.value}"`));

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = document.getElementById("formIn").value;
        log("submit", `(preventDefault → no reload) value="${v}"`);
      });

      const hover = document.getElementById("hover");
      hover.addEventListener("mouseenter", () => log("mouseenter"));
      hover.addEventListener("mouseleave", () => log("mouseleave"));
      hover.addEventListener("keydown", (e) => log("keydown", `key="${e.key}"`));
    </script>
  </body>
</html>
