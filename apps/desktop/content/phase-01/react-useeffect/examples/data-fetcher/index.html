<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>useEffect data fetcher</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .panel { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
      .ids { display: flex; gap: 8px; margin-bottom: 14px; }
      .ids button { padding: 6px 14px; background: white; border: 1px solid #d1d5db; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; cursor: pointer; }
      .ids button.active { background: #4763e4; color: white; border-color: #4763e4; }
      .result { background: white; border: 1px dashed #d1d5db; border-radius: 6px; padding: 14px; min-height: 60px; }
      .spinner { width: 22px; height: 22px; border: 3px solid #e5e7eb; border-top-color: #4763e4; border-radius: 50%; animation: spin 700ms linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .log { background: #1c2230; color: #e6edf3; padding: 10px; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 11px; margin-top: 12px; max-height: 100px; overflow-y: auto; }
      .log .blue { color: #58a6ff; }
      .log .green { color: #3fb950; }
      .log .gray { color: #6e7b8e; }
    </style>
  </head>
  <body>
    <h1>useEffect with AbortController</h1>
    <p>Pick a user. The effect re-runs because <code>id</code> is in its dep array. Quick switches abort the previous request so we don't process stale data.</p>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Mock "API" — delayed promise
      const USERS = {
        1: { name: "Aisha Nakato", role: "Frontend dev" },
        2: { name: "Brian Kim",    role: "Designer" },
        3: { name: "Daniel Reyes", role: "Engineer" },
      };
      function mockFetch(id, signal) {
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => resolve(USERS[id]), 700);
          if (signal) signal.addEventListener("abort", () => {
            clearTimeout(t);
            reject(Object.assign(new Error("aborted"), { name: "AbortError" }));
          });
        });
      }

      function App() {
        const [id, setId] = useState(1);
        const [user, setUser] = useState(null);
        const [log, setLog] = useState([]);
        const append = (line, cls) =>
          setLog((prev) => [{ line, cls, t: Date.now() }, ...prev].slice(0, 8));

        useEffect(() => {
          append(`effect runs (id=${id})`, "blue");
          const controller = new AbortController();
          setUser(null);
          mockFetch(id, controller.signal)
            .then((u) => {
              append(`✓ got user "${u.name}"`, "green");
              setUser(u);
            })
            .catch((err) => {
              if (err.name === "AbortError")
                append("(previous fetch aborted by cleanup)", "gray");
            });
          return () => {
            append(`cleanup (was id=${id})`, "gray");
            controller.abort();
          };
        }, [id]);

        return (
          <div className="panel">
            <div className="ids">
              {[1, 2, 3].map((n) => (
                <button key={n} className={id === n ? "active" : ""} onClick={() => setId(n)}>
                  user {n}
                </button>
              ))}
            </div>
            <div className="result">
              {!user
                ? <div className="spinner" />
                : <><strong>{user.name}</strong><br /><span style={{color:'#6b7280', fontSize: 13}}>{user.role}</span></>}
            </div>
            <div className="log">
              {log.length === 0
                ? <div className="gray">(events appear here)</div>
                : log.map((l, i) => (
                    <div key={l.t + "" + i} className={l.cls}>
                      {l.line}
                    </div>
                  ))}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
