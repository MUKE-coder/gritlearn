<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>useEffect cleanup demo</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .panel { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; text-align: center; }
      .ticker { font-size: 60px; font-weight: 800; color: #4763e4; font-variant-numeric: tabular-nums; margin: 8px 0 12px; }
      button { padding: 8px 16px; background: #4763e4; color: white; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
      button.ghost { background: white; color: #4763e4; border: 1px solid #4763e4; }
      .info { padding: 10px 12px; background: #eef2ff; border-left: 4px solid #4763e4; border-radius: 0 6px 6px 0; margin-top: 14px; font-size: 12px; color: #4338ca; }
      .log { background: #1c2230; color: #e6edf3; padding: 10px; border-radius: 6px; margin-top: 14px; font-family: ui-monospace, monospace; font-size: 11px; min-height: 70px; max-height: 110px; overflow-y: auto; text-align: left; }
      .log .ok  { color: #3fb950; }
      .log .clean { color: #f9a825; }
    </style>
  </head>
  <body>
    <h1>Timer with cleanup</h1>
    <p>Click "mount" — a counter starts ticking. Click "unmount" — the cleanup runs, the timer is cleared, and the counter is gone. Without cleanup, the interval would keep firing in the void.</p>

    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const log = [];
      function rebuildLog() {
        const el = document.getElementById("log");
        if (el) el.innerHTML = log.slice(-10).reverse().map((l) =>
          `<div class="${l.cls}">${l.text}</div>`
        ).join("");
      }
      function append(text, cls = "") {
        log.push({ text, cls });
        rebuildLog();
      }

      function Ticker() {
        const [count, setCount] = useState(0);

        useEffect(() => {
          append("✓ setup — setInterval started", "ok");
          const id = setInterval(() => setCount((c) => c + 1), 1000);
          return () => {
            append("✗ cleanup — clearInterval", "clean");
            clearInterval(id);
          };
        }, []);

        return (
          <div className="panel">
            <div className="ticker">{count}</div>
            <p style={{color: '#6b7280', fontSize: 13, margin: 0}}>Seconds since this Ticker mounted</p>
          </div>
        );
      }

      function App() {
        const [mounted, setMounted] = useState(true);
        return (
          <>
            <div style={{display: 'flex', gap: 8, marginBottom: 14, justifyContent: 'center'}}>
              <button onClick={() => setMounted(true)} disabled={mounted}>mount</button>
              <button className="ghost" onClick={() => setMounted(false)} disabled={!mounted}>unmount</button>
            </div>
            {mounted ? <Ticker /> : (
              <div className="panel" style={{color: '#6b7280', textAlign: 'center', padding: 30}}>
                (Ticker is not mounted — cleanup ran and the interval is cleared)
              </div>
            )}
            <div className="info">Open this file's source — the cleanup function returned by useEffect is what makes unmount safe.</div>
            <div className="log" id="log"></div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
