<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live API request, demystified</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
      .pane { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; }
      .pane h2 { margin: 0 0 6px; font-family: ui-monospace, monospace; font-size: 13px; color: #4763e4; }
      pre { background: #1c2230; color: #e6edf3; padding: 12px; border-radius: 6px; font-size: 11px; line-height: 1.4; overflow-x: auto; margin: 0; }
      button { padding: 10px 18px; background: #4763e4; color: white; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .meta { font-size: 12px; color: #6b7280; }
      .ok  { color: #047857; font-weight: 700; }
      .err { color: #b91c1c; font-weight: 700; }
      @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Live API request, demystified</h1>
    <p>Click the button to fetch a small JSON file. The two panes show what came back.</p>

    <button id="go">fetch /assets/sample.json (mocked)</button>

    <div class="row">

      <div class="pane">
        <h2>Response metadata</h2>
        <pre id="meta">(not run yet)</pre>
      </div>

      <div class="pane">
        <h2>Parsed body (JS object)</h2>
        <pre id="data">(not run yet)</pre>
      </div>

    </div>

    <script>
      // Since this example runs offline (preview pane), we mock fetch
      // with a Promise that resolves to a fake Response. The shape is
      // identical to what real fetch returns.
      function mockFetch() {
        const body = {
          name: "Aisha Nakato",
          email: "aisha@example.com",
          orders: 12,
          last_login: "2026-06-15T09:32:00Z",
        };
        const json = JSON.stringify(body);
        return new Promise((resolve) => {
          setTimeout(() => resolve({
            ok: true,
            status: 200,
            statusText: "OK",
            url: "/assets/sample.json",
            headers: new Headers({ "Content-Type": "application/json" }),
            text: async () => json,
            json: async () => JSON.parse(json),
          }), 300);
        });
      }

      const goBtn = document.getElementById("go");
      goBtn.addEventListener("click", async () => {
        goBtn.disabled = true;
        document.getElementById("meta").textContent = "loading...";
        document.getElementById("data").textContent = "loading...";

        try {
          const res = await mockFetch();
          const meta = `ok:          ${res.ok}
status:      ${res.status} ${res.statusText}
url:         ${res.url}
content-type: ${res.headers.get("Content-Type")}`;
          document.getElementById("meta").textContent = meta;

          if (!res.ok) {
            document.getElementById("data").innerHTML = `<span class="err">request failed</span>`;
            return;
          }
          const data = await res.json();
          document.getElementById("data").textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          document.getElementById("data").innerHTML = `<span class="err">${err.name}: ${err.message}</span>`;
        } finally {
          goBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
