<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>useState counter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 22px; text-align: center; }
      .num { font-size: 56px; font-weight: 800; color: #4763e4; margin: 8px 0 16px; font-variant-numeric: tabular-nums; }
      .row { display: flex; gap: 8px; justify-content: center; }
      button { padding: 8px 18px; background: #4763e4; color: white; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
      button.ghost { background: white; color: #4763e4; border: 1px solid #4763e4; }
      .log { background: #1c2230; color: #e6edf3; border-radius: 8px; padding: 12px; margin-top: 16px; font-family: ui-monospace, monospace; font-size: 11px; max-height: 120px; overflow-y: auto; }
    </style>
  </head>
  <body>
    <h1>useState counter</h1>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      function Counter() {
        const [count, setCount] = useState(0);
        const renderCount = useRef(0);
        const [log, setLog] = useState([]);

        useEffect(() => {
          renderCount.current++;
          setLog((prev) => [`render #${renderCount.current} — count=${count}`, ...prev].slice(0, 8));
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [count]);

        return (
          <div className="card">
            <div className="num">{count}</div>
            <div className="row">
              {/* Direct setter call */}
              <button onClick={() => setCount(count + 1)}>+1</button>
              <button onClick={() => setCount(count - 1)} className="ghost">−1</button>
              {/* Functional update form */}
              <button onClick={() => setCount((c) => c + 5)}>+5</button>
              <button onClick={() => setCount(0)} className="ghost">reset</button>
            </div>
            <div className="log">
              <div style={{color: '#6e8bff', marginBottom: 6}}>render log:</div>
              {log.map((line, i) => <div key={i}>{line}</div>)}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Counter />);
    </script>
  </body>
</html>
