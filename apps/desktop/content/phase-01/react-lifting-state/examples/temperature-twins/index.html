<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lifted state — dial and display</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; }
      .pane { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; text-align: center; }
      .pane h2 { margin: 0 0 8px; font-family: ui-monospace, monospace; font-size: 12px; color: #6b7280; }
      input[type=range] { width: 100%; }
      .display { font-size: 60px; font-weight: 800; color: #4763e4; font-variant-numeric: tabular-nums; }
      .display .unit { font-size: 24px; color: #6b7280; margin-left: 4px; }
      .hint { padding: 10px 14px; background: #eef2ff; border-left: 4px solid #4763e4; border-radius: 0 6px 6px 0; margin-top: 14px; font-size: 12px; color: #4338ca; }
      @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Lifted state — siblings share data</h1>
    <p>Move the slider. Both panes see the same number because their parent owns it.</p>

    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function Dial({ temp, onChange }) {
        return (
          <div className="pane">
            <h2>&lt;Dial /&gt;</h2>
            <input type="range" min={0} max={40} value={temp} onChange={(e) => onChange(+e.target.value)} />
            <p style={{margin:'10px 0 0', fontSize:12, color:'#6b7280'}}>set to <strong>{temp}°C</strong></p>
          </div>
        );
      }

      function Display({ temp }) {
        return (
          <div className="pane">
            <h2>&lt;Display /&gt;</h2>
            <div className="display">{temp}<span className="unit">°C</span></div>
            <p style={{margin:'6px 0 0', fontSize:12, color: temp > 30 ? '#b91c1c' : temp > 20 ? '#b45309' : '#047857'}}>
              {temp > 30 ? "hot 🥵" : temp > 20 ? "warm" : "comfortable"}
            </p>
          </div>
        );
      }

      function App() {
        // ── The state lives HERE — at the closest common ancestor of Dial and Display. ──
        const [temp, setTemp] = useState(20);
        return (
          <>
            <div className="row">
              <Dial    temp={temp} onChange={setTemp} />
              <Display temp={temp}                   />
            </div>
            <div className="hint">
              Dial calls setTemp (a callback prop). Display reads temp (a value prop). Neither child has its own useState.
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
