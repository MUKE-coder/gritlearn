<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lifted controlled input + preview</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .panel { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; }
      label { font-size: 12px; color: #6b7280; }
      input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-top: 4px; }
      input:focus { outline: 2px solid #4763e4; border-color: #4763e4; }
      .preview { margin-top: 18px; padding: 16px; background: white; border: 1px dashed #d1d5db; border-radius: 8px; }
      .preview .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
      .preview .markdown {
        font-family: ui-monospace, monospace; font-size: 13px;
        background: #1c2230; color: #e6edf3; padding: 10px; border-radius: 6px;
        white-space: pre-wrap;
      }
      .info { padding: 10px 12px; background: #eef2ff; border-left: 4px solid #4763e4; border-radius: 0 6px 6px 0; margin-top: 14px; font-size: 12px; color: #4338ca; }
    </style>
  </head>
  <body>
    <h1>Input + preview, state lifted</h1>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function NameField({ value, onChange }) {
        return (
          <div>
            <label>Display name</label>
            <input value={value} onChange={(e) => onChange(e.target.value)} placeholder="enter a name..." />
          </div>
        );
      }

      function Preview({ value }) {
        const safe = value.trim() === "" ? "Anonymous" : value.trim();
        return (
          <div className="preview">
            <div className="label">Markdown preview</div>
            <div className="markdown"># Hi, I'm {safe}.{"\n"}Welcome to my page!</div>
          </div>
        );
      }

      function App() {
        // The state lives at the parent. NameField writes to it; Preview reads from it.
        const [name, setName] = useState("");
        return (
          <div className="panel">
            <NameField value={name} onChange={setName} />
            <Preview   value={name} />
            <div className="info">
              The &lt;NameField&gt; doesn't own the value — App does. The &lt;Preview&gt; reads the same value. Two consumers, one source of truth.
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
