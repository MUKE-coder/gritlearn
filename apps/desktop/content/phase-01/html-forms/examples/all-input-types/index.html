<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>All common input types</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 20px; line-height: 1.6; }
      form { display: grid; grid-template-columns: 140px 1fr; gap: 14px 16px; align-items: center; margin-top: 20px; }
      label { font-size: 13px; color: #555; }
      input, select, textarea {
        padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
        font-size: 14px; font-family: inherit;
      }
      input:focus, select:focus, textarea:focus { outline: 2px solid #4763e4; border-color: #4763e4; }
      .radio-group, .checkbox-group { display: flex; gap: 16px; }
      .radio-group label, .checkbox-group label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #222; }
      button { grid-column: 2; padding: 10px; background: #4763e4; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Every common input type</h1>
    <p style="font-size: 13px; color: #666;">
      Open this page on a phone and tap each field — notice how the keyboard
      layout changes based on the input's <code>type</code>.
    </p>
    <form>
      <label for="t1">type="text"</label>
      <input id="t1" type="text" placeholder="Hello" />

      <label for="t2">type="email"</label>
      <input id="t2" type="email" placeholder="you@example.com" />

      <label for="t3">type="password"</label>
      <input id="t3" type="password" />

      <label for="t4">type="number"</label>
      <input id="t4" type="number" min="0" max="100" />

      <label for="t5">type="date"</label>
      <input id="t5" type="date" />

      <label for="t6">type="range"</label>
      <input id="t6" type="range" min="0" max="10" />

      <label for="t7">type="tel"</label>
      <input id="t7" type="tel" placeholder="+1 555 ..." />

      <label for="t8">type="url"</label>
      <input id="t8" type="url" placeholder="https://" />

      <label>type="checkbox"</label>
      <div class="checkbox-group">
        <label><input type="checkbox" checked /> Pizza</label>
        <label><input type="checkbox" /> Sushi</label>
      </div>

      <label>type="radio"</label>
      <div class="radio-group">
        <label><input type="radio" name="size" value="s" /> S</label>
        <label><input type="radio" name="size" value="m" checked /> M</label>
        <label><input type="radio" name="size" value="l" /> L</label>
      </div>

      <label for="t11">&lt;select&gt;</label>
      <select id="t11">
        <option>Search</option>
        <option>Friend</option>
        <option>Twitter</option>
      </select>

      <label for="t12">&lt;textarea&gt;</label>
      <textarea id="t12" rows="3" placeholder="Tell us more..."></textarea>

      <button type="button" onclick="alert('Just a demo — nothing submitted')">Demo button</button>
    </form>
  </body>
</html>
