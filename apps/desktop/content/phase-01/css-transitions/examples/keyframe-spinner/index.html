<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three loading spinners</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
      .pane { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; border: 1px solid #e5e7eb; border-radius: 10px; }
      .label { font-family: ui-monospace, monospace; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; }

      /* 1) Rotating circle */
      @keyframes spin { to { transform: rotate(360deg); } }
      .ring {
        width: 36px; height: 36px;
        border: 3px solid #e5e7eb;
        border-top-color: #4763e4;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      /* 2) Pulsing dot */
      @keyframes pulse {
        0%   { transform: scale(0.6); opacity: 0.4; }
        50%  { transform: scale(1);   opacity: 1;   }
        100% { transform: scale(0.6); opacity: 0.4; }
      }
      .dot {
        width: 24px; height: 24px; border-radius: 50%;
        background: #4763e4;
        animation: pulse 1200ms ease-in-out infinite;
      }

      /* 3) Three-dot wave */
      .wave { display: flex; gap: 6px; }
      .wave span {
        width: 10px; height: 10px; border-radius: 50%;
        background: #4763e4;
        animation: bounce 900ms ease-in-out infinite;
      }
      .wave span:nth-child(2) { animation-delay: 150ms; }
      .wave span:nth-child(3) { animation-delay: 300ms; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50%      { transform: translateY(-8px); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ring, .dot, .wave span { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <h1>Three spinners, three feelings</h1>
    <p>Same purpose — "we're working on it" — different vibe. None of them use JavaScript.</p>

    <div class="row">
      <div class="pane">
        <div class="ring" aria-label="Loading"></div>
        <span class="label">Rotating ring</span>
      </div>
      <div class="pane">
        <div class="dot" aria-label="Loading"></div>
        <span class="label">Pulsing dot</span>
      </div>
      <div class="pane">
        <div class="wave" aria-label="Loading"><span></span><span></span><span></span></div>
        <span class="label">Three-dot wave</span>
      </div>
    </div>
  </body>
</html>
