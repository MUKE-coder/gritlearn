<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Six React event handlers</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 20px; line-height: 1.6; color: #111; }
      .panel { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
      input, button { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
      button { background: #4763e4; color: white; border: 0; font-weight: 600; cursor: pointer; }
      button:hover { background: #3a53c6; }
      .hover-box { padding: 10px; background: #fef3c7; border: 1px dashed #f59e0b; border-radius: 6px; text-align: center; cursor: pointer; }
      .log { background: #1c2230; color: #e6edf3; border-radius: 8px; padding: 12px; margin-top: 14px; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5; max-height: 180px; overflow-y: auto; }
      .log .ts { color: #6e7b8e; }
      .log .ev { color: #58a6ff; }
    </style>
  </head>
  <body>
    <h1>Six React event handlers</h1>
    <p>Interact with the panel. Each handler logs into the console below.</p>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function Panel() {
        const [log, setLog] = useState([]);
        const [text, setText] = useState("");

        const record = (event, detail = "") => {
          const i = log.length + 1;
          setLog((prev) => [{ i, event, detail }, ...prev].slice(0, 16));
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          record("onSubmit", `value="${text}" (preventDefault, no reload)`);
        };

        return (
          <div className="panel">
            <div className="row">
              {/* Inline handler */}
              <button onClick={() => record("onClick", "(inline arrow)")}>click me</button>
              {/* Controlled input */}
              <input
                placeholder="type..."
                value={text}
                onChange={(e) => { setText(e.target.value); record("onChange", `"${e.target.value}"`); }}
                onFocus={() => record("onFocus")}
              />
            </div>

            <form className="row" onSubmit={handleSubmit}>
              <input placeholder="press Enter" />
              <button>submit</button>
            </form>

            <div
              className="hover-box"
              tabIndex={0}
              onMouseEnter={() => record("onMouseEnter")}
              onKeyDown={(e) => record("onKeyDown", `key="${e.key}"`)}
            >
              hover or focus + press a key
            </div>

            <div className="log">
              {log.length === 0
                ? "(events will appear here)"
                : log.map((l) => (
                    <div key={l.i}>
                      <span className="ts">#{String(l.i).padStart(3, "0")}</span>{" "}
                      <span className="ev">{l.event}</span> {l.detail}
                    </div>
                  ))}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Panel />);
    </script>
  </body>
</html>
