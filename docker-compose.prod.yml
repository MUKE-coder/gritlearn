# Production stack.
#
# Security posture: nothing in this file uses `ports:` — only
# `expose:`. That means none of these services bind to the public host
# interface. Traffic reaches the API and the front-ends ONLY through
# your reverse proxy (Traefik, Caddy, nginx, or a managed PaaS like
# Dokploy/Coolify), which lives on the same Docker network and routes
# domain.com → `api:8080`, app.domain.com → `admin:3000`, etc.
#
# Postgres and Redis have NO host binding at all — they're reachable
# only by containers on the `gritlearn` network. That's the property you
# want: a successful host-level compromise still has to pop a container
# to reach the database.
#
# MinIO is included as an option but most production deployments use
# Cloudflare R2 or AWS S3 (see STORAGE_* in .env). Delete the minio
# service if you're on managed object storage.
#
# To configure your reverse proxy:
#   - Point your apex domain at the api container's expose port (8080)
#   - Point app.domain.com at the admin container (3000)
#   - Point www.domain.com at the web container (3000)
#   - Use Let's Encrypt or your PaaS' auto-TLS for HTTPS — never serve
#     the API over plain HTTP in production.

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gritlearn-api
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from .env
    # (env_file above). We override POSTGRES_HOST so the API hits the
    # postgres container on the Docker network instead of 'localhost'.
    # The Go config builds DATABASE_URL from these parts at startup.
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      # Desktop-release pipeline. The handler reads these to pick which
      # GitHub repo + tag to surface as the latest release on the
      # marketing /download page. Each one is optional — sensible
      # defaults in desktop_release_handler.go ship without any of
      # these set, EXCEPT GITHUB_TOKEN which is required when the
      # repo is private (env_file alone doesn't reach the container,
      # the ${...} interpolation here forwards from .env).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DESKTOP_GITHUB_OWNER: ${DESKTOP_GITHUB_OWNER:-}
      DESKTOP_GITHUB_REPO: ${DESKTOP_GITHUB_REPO:-}
      DESKTOP_LATEST_VERSION: ${DESKTOP_LATEST_VERSION:-}
      DESKTOP_LATEST_URL: ${DESKTOP_LATEST_URL:-}
      DESKTOP_LATEST_RELEASED_AT: ${DESKTOP_LATEST_RELEASED_AT:-}
      DESKTOP_LATEST_RELEASE_NOTES: ${DESKTOP_LATEST_RELEASE_NOTES:-}
      DESKTOP_DOWNLOAD_BASE: ${DESKTOP_DOWNLOAD_BASE:-}
      # Admin seed — see SEED_ADMINS_ON_BOOT in .env. The handler in
      # internal/database/seed.go is a no-op when email/password are
      # empty, so unset values fail safe.
      SEED_ADMINS_ON_BOOT: ${SEED_ADMINS_ON_BOOT:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gritlearn

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Still baked into the client bundle for browser-side fetches
        # (login, register, etc). The /download page no longer relies
        # on this — see API_INTERNAL_URL below.
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8080}
    container_name: gritlearn-web
    restart: unless-stopped
    expose:
      - "3000"
    # Runtime env. API_INTERNAL_URL is read at REQUEST time by the
    # /download Server Component so it hits the API on the docker
    # network (no DNS, no hairpin NAT, no CORS). Hard-coded to the
    # api service name because that's the canonical in-network URL —
    # override here only if you split the API onto a different host.
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on:
      - api
    networks:
      - gritlearn

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8080}
    container_name: gritlearn-admin
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - gritlearn

  postgres:
    image: postgres:16-alpine
    container_name: gritlearn-postgres
    restart: unless-stopped
    env_file:
      - .env
    # Identical credentials to the api service above — they come from the
    # SAME .env block, so they can't drift. The :-grit fallbacks below
    # protect against a missing env var blocking startup.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grit}
      POSTGRES_DB: ${POSTGRES_DB:-gritlearn}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grit} -d ${POSTGRES_DB:-gritlearn}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gritlearn

  redis:
    image: redis:7-alpine
    container_name: gritlearn-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gritlearn

  minio:
    image: minio/minio
    container_name: gritlearn-minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - gritlearn
    command: server /data --console-address ":9001"

networks:
  gritlearn:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
